name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository files
        run: python tools/check_repository.py
      - name: Protocol tests with localhost TCP sockets
        run: python -m unittest discover -s tests -v
      - name: Build installation and source package
        run: python tools/build_package.py

  hacs:
    name: HACS custom repository
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Validate custom-repository installation, not catalog publication.
          # Description/topics are GitHub settings and brands require a separate
          # submission. None of these action-only checks runs during installation.
          ignore: description topics brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
